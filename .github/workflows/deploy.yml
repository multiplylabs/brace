name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Granted per job below.
permissions: {}

# One deployment at a time; let an in-progress deployment finish.
concurrency:
  group: pages
  cancel-in-progress: false

# Actions are pinned to commit SHAs. The comment after each SHA says which version it is.
jobs:
  build:
    # Only ever publish main, including for manual runs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages reads the Pages config, which a private repo only exposes to this scope.
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Publish only the site itself, not the repo's docs, scripts or config.
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html _site/
          cp -R assets _site/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
